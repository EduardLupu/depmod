name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: lint / typecheck / test / build on every PR + push.
  # Linux-only across the full Node version matrix — the source code itself
  # rarely behaves differently per OS, so we save CI minutes by reserving
  # the full OS matrix for the smoke-install job below.
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.18", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Internal packages (`@depmod/types`, `@depmod/parser`) expose their
      # `exports` map at `./dist/index.js`, so anything that resolves them via
      # the package map needs them built first. Vitest in `packages/parser`
      # is the main consumer — it fails with "Failed to resolve entry for
      # package @depmod/types" on a fresh checkout otherwise.
      - name: Build internal packages
        run: pnpm --filter @depmod/types --filter @depmod/parser build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack depmod-ui tarball
        # `--pack-destination` keeps the tarball location predictable across
        # pnpm versions (10.x packs in the workspace root by default).
        run: pnpm --filter depmod-ui pack --pack-destination ./packages/cli

  # Cross-platform tarball smoke test. Proves the *published* artifact
  # actually installs and the bin shim runs on every supported OS — not just
  # the build machine. This is the test that would have caught the
  # Windows MAX_PATH / native-binary issue in v0.2.0 before it shipped.
  #
  # We pin to a single Node version (24) per OS to keep the matrix to three
  # jobs; Node-version variance is already covered by `verify`.
  smoke-install:
    name: Smoke install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Need both internal builds and the Next.js standalone build before
      # `prepack` can assemble the tarball.
      - name: Build everything
        run: pnpm build

      - name: Pack depmod-ui tarball
        # `--pack-destination` keeps the tarball location predictable across
        # pnpm versions (10.x packs in the workspace root by default).
        run: pnpm --filter depmod-ui pack --pack-destination ./packages/cli

      # Install the freshly packed tarball into a throwaway directory, then
      # run the bin shim. If extraction fails (e.g. Windows MAX_PATH) the
      # shim won't exist and `--version` will exit non-zero.
      - name: Smoke install + --version
        shell: bash
        run: |
          set -euo pipefail
          TARBALL=$(ls packages/cli/depmod-ui-*.tgz | head -n 1)
          echo "Installing $TARBALL"
          mkdir -p smoke && cd smoke
          npm init -y >/dev/null
          npm install --no-audit --no-fund "../$TARBALL"
          # The bin lives at `node_modules/.bin/depmod-ui` on POSIX and
          # `node_modules/.bin/depmod-ui.cmd` on Windows; npm exec handles both.
          npx --no-install depmod-ui --version
