name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.18", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Internal packages (`@depmod/types`, `@depmod/parser`) expose their
      # `exports` map at `./dist/index.js`, so anything that resolves them via
      # the package map needs them built first. Vitest in `packages/parser`
      # is the main consumer — it fails with "Failed to resolve entry for
      # package @depmod/types" on a fresh checkout otherwise. Build the
      # internals before typecheck/test; the CLI bundle build still happens
      # via the full `pnpm build` step below so the tarball includes the
      # latest sources.
      - name: Build internal packages
        run: pnpm --filter @depmod/types --filter @depmod/parser build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack depmod-ui tarball
        run: pnpm --filter depmod-ui pack
