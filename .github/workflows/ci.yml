name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: lint / typecheck / test / build on every PR + push.
  # Linux-only across the full Node version matrix — the source code itself
  # rarely behaves differently per OS, so we save CI minutes by reserving
  # the full OS matrix for the smoke-install job below.
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.18", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Internal packages (`@depmod/types`, `@depmod/parser`) expose their
      # `exports` map at `./dist/index.js`, so anything that resolves them via
      # the package map needs them built first. Vitest in `packages/parser`
      # is the main consumer — it fails with "Failed to resolve entry for
      # package @depmod/types" on a fresh checkout otherwise.
      - name: Build internal packages
        run: pnpm --filter @depmod/types --filter @depmod/parser build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack depmod-ui tarball
        # `--pack-destination` keeps the tarball location predictable across
        # pnpm versions (10.x packs in the workspace root by default).
        # `DEPMOD_SKIP_WEB_BUILD=1` tells `prepare-package.mjs` not to re-run
        # `pnpm --filter web build` — the previous step already built it.
        env:
          DEPMOD_SKIP_WEB_BUILD: "1"
        run: pnpm --filter depmod-ui pack --pack-destination ./packages/cli

      - name: Assert tarball contains CLI bundle
        shell: bash
        run: |
          set -euo pipefail
          TARBALL=$(ls packages/cli/depmod-ui-*.tgz | head -n 1)
          tar -tzf "$TARBALL" | grep -q 'package/dist/index.js'

  # Cross-platform tarball smoke test. Proves the *published* artifact
  # actually installs and the bin shim runs on every supported OS — not just
  # the build machine. This is the test that would have caught the
  # Windows MAX_PATH / native-binary issue in v0.2.0 before it shipped.
  #
  # We pin to a single Node version (24) per OS to keep the matrix to three
  # jobs; Node-version variance is already covered by `verify`.
  smoke-install:
    name: Smoke install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Need both internal builds and the Next.js standalone build before
      # `prepack` can assemble the tarball.
      - name: Build everything
        run: pnpm build

      - name: Pack depmod-ui tarball
        # `--pack-destination` keeps the tarball location predictable across
        # pnpm versions (10.x packs in the workspace root by default).
        # `DEPMOD_SKIP_WEB_BUILD=1` tells `prepare-package.mjs` not to re-run
        # `pnpm --filter web build` — the previous step already built it.
        env:
          DEPMOD_SKIP_WEB_BUILD: "1"
        run: pnpm --filter depmod-ui pack --pack-destination ./packages/cli

      - name: Assert tarball contains CLI bundle
        shell: bash
        run: |
          set -euo pipefail
          TARBALL=$(ls packages/cli/depmod-ui-*.tgz | head -n 1)
          tar -tzf "$TARBALL" | grep -q 'package/dist/index.js'
          tar -tzf "$TARBALL" | grep -q 'package/web/apps/web/server.js'

      # Two-tier install test — local + global. The local test catches
      # tarball extraction and bin shim creation bugs. The global test
      # catches the failure users actually hit in the wild: install
      # globally, then run by name (resolved via PATH). Both must pass.
      - name: Smoke (local install)
        shell: bash
        run: |
          set -euo pipefail
          TARBALL=$(ls packages/cli/depmod-ui-*.tgz | head -n 1)
          echo "Installing $TARBALL"
          mkdir -p smoke && cd smoke
          npm init -y >/dev/null
          npm install --no-audit --no-fund "../$TARBALL"
          # Resolves via node_modules/.bin/{depmod-ui,depmod-ui.cmd}.
          npx --no-install depmod-ui --version

      - name: Smoke (global install + PATH invocation)
        shell: bash
        run: |
          set -euo pipefail
          TARBALL=$(ls packages/cli/depmod-ui-*.tgz | head -n 1)
          echo "Installing $TARBALL globally"
          npm install -g --no-audit --no-fund "$TARBALL"
          # Ensure npm's global prefix is on PATH (Windows runners include
          # it; macOS sometimes doesn't on freshly set-up actions/setup-node).
          NPM_PREFIX=$(npm config get prefix)
          case "$RUNNER_OS" in
            Windows) export PATH="$NPM_PREFIX:$PATH" ;;
            *)       export PATH="$NPM_PREFIX/bin:$PATH" ;;
          esac
          echo "PATH includes npm prefix: $NPM_PREFIX"
          # This is the invocation real users hit — resolved purely via PATH.
          depmod-ui --version
