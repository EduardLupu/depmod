name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version / Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # `pnpm changeset:version` runs `changeset version` AND immediately
          # reformats the rewritten package.json files through biome — without
          # that follow-up, the changesets' own JSON writer expands the `files`
          # array onto multiple lines and our pre-commit hook (plus CI lint)
          # rejects the resulting "chore: version packages" commit.
          version: pnpm changeset:version
          publish: pnpm publish -r --access public --provenance
          commit: "chore: version packages"
          title: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `actions/setup-node` with `registry-url:` writes an `.npmrc`
          # that references ${NODE_AUTH_TOKEN}. `npm publish` follows it via
          # NPM_CONFIG_USERCONFIG, so NODE_AUTH_TOKEN must be set or the
          # token resolves to an empty string and the registry replies 404.
          # NPM_TOKEN is kept because `changesets/action` reads it for its
          # own `.npmrc` fallback.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Belt-and-suspenders: CI runs `pnpm lint` on its own, so the
          # local pre-commit hook is redundant here. Skip it so a transient
          # biome version mismatch can never strand the release workflow.
          SKIP_SIMPLE_GIT_HOOKS: "1"
