name: Feature request
description: Suggest an improvement or new capability
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain point does this solve? Who benefits?
      placeholder: When exploring a large monorepo, I can't easily ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should depmod behave? UI, CLI flag, parser change?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or workarounds you've tried.

  - type: checkboxes
    id: scope
    attributes:
      label: Area
      options:
        - label: CLI (`depmod-ui`)
        - label: Dashboard (web UI)
        - label: Parser / graph analysis
        - label: Documentation
